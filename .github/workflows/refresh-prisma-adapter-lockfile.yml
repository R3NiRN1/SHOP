name: Refresh Prisma Adapter Lockfile

on:
  push:
    branches:
      - fix/prisma7-postgres-adapter
    paths:
      - 'apps/web/package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/refresh-prisma-adapter-lockfile.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/prisma7-postgres-adapter

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high --ignore-registry-errors

      - name: Commit refreshed lockfile and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'REN'
          git config user.email 'r3nirn1@gmail.com'
          rm .github/workflows/refresh-prisma-adapter-lockfile.yml
          git add pnpm-lock.yaml .github/workflows/refresh-prisma-adapter-lockfile.yml
          if git diff --cached --quiet; then
            echo 'No lockfile change was produced.'
            exit 1
          fi
          git commit -m 'chore: refresh lockfile for Prisma PostgreSQL adapter'
          git push origin HEAD:fix/prisma7-postgres-adapter
