name: Agent PR Contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  contract:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR template sections
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          body = os.environ.get('PR_BODY', '')
          required_headings = [
              '## Summary',
              '## Acceptance Criteria',
              '## Changes',
              '## Verification',
              '## Risk & Rollback',
          ]
          risky_files = [
              '.github/workflows/',
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              'package.json',
              'apps/web/package.json',
          ]

          missing_headings = [heading for heading in required_headings if heading not in body]
          if missing_headings:
              print('Missing required PR body sections:')
              for heading in missing_headings:
                  print(f'- {heading}')
              sys.exit(1)

          diff_output = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              text=True,
          )
          changed_files = [line for line in diff_output.splitlines() if line]
          touched_risky_files = [
              path for path in changed_files
              if any(
                  path == risky_path or path.startswith(risky_path)
                  for risky_path in risky_files
              )
          ]

          if touched_risky_files and 'ALLOW_CONFIG_CHANGE' not in body:
              print('Missing required PR body token: ALLOW_CONFIG_CHANGE')
              print('ALLOW_CONFIG_CHANGE is required because this PR changes risky files:')
              for path in touched_risky_files:
                  print(f'- {path}')
              sys.exit(1)

          if touched_risky_files:
              print('PR body contains all required sections and ALLOW_CONFIG_CHANGE for risky changes.')
          else:
              print('PR body contains all required sections. No risky files changed, so ALLOW_CONFIG_CHANGE is not required.')
          PY

      - name: Ensure diff against main is available
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD
