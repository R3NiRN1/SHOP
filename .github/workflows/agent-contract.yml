name: Agent PR Contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate PR template sections
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          body = os.environ.get('PR_BODY', '')
          required_headings = [
              '## Summary',
              '## Acceptance Criteria',
              '## Changes',
              '## Verification',
              '## Risk & Rollback',
          ]
          risky_files = [
              '.github/workflows/',
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              'package.json',
              'apps/web/package.json',
              'apps/web/prisma/schema.prisma',
              'apps/web/prisma/migrations/',
              'apps/web/src/lib/auth-options.ts',
              'apps/web/src/lib/runtime-env.ts',
              'apps/web/src/app/api/auth/',
              'apps/web/src/app/api/admin/',
          ]

          missing_headings = [heading for heading in required_headings if heading not in body]
          if missing_headings:
              print('Missing required PR body sections:')
              for heading in missing_headings:
                  print(f'- {heading}')
              sys.exit(1)

          subprocess.check_call(['git', 'fetch', 'origin', 'main'])
          diff_output = subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True)
          changed_files = [line for line in diff_output.splitlines() if line]
          touched_risky_files = [path for path in changed_files if any(path == risky_path or path.startswith(risky_path) for risky_path in risky_files)]

          if touched_risky_files and 'ALLOW_CONFIG_CHANGE' not in body:
              print('Missing required PR body token: ALLOW_CONFIG_CHANGE')
              for path in touched_risky_files:
                  print(f'- {path}')
              sys.exit(1)

          print('PR contract passed.')
          PY
