name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-placeholder-not-for-prod
      NEXTAUTH_SECRET: ci-placeholder-not-for-prod
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin
      SHOP_CONTACT_EMAIL: ci@shop.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Preflight
        run: pnpm run preflight

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm -C apps/web exec prisma generate

      - name: Lint
        run: pnpm -C apps/web lint

      - name: Typecheck
        run: pnpm -C apps/web typecheck

      - name: Unit tests
        run: pnpm -C apps/web test

      - name: Build
        run: pnpm -C apps/web build

      - name: Doctor
        run: pnpm run doctor
