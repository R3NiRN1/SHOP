name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-placeholder-not-for-prod
      NEXTAUTH_SECRET: ci-placeholder-not-for-prod
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin
      SHOP_CONTACT_EMAIL: ci@shop.test
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Preflight
        run: pnpm run preflight

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high --ignore-registry-errors

      - name: Prisma generate
        run: pnpm -C apps/web exec prisma generate

      - name: Lint
        run: pnpm -C apps/web lint

      - name: Typecheck
        run: pnpm -C apps/web typecheck

      - name: Unit tests
        run: pnpm -C apps/web test

      - name: Build
        run: pnpm -C apps/web build

      - name: Doctor
        run: pnpm run doctor

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_DB: shop_test
          POSTGRES_USER: shop_test
          POSTGRES_PASSWORD: shop_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop_test -d shop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RUN_POSTGRES_INTEGRATION: 'true'
      DATABASE_URL: postgresql://shop_test:shop_test_password@127.0.0.1:5432/shop_test?schema=public
      AUTH_SECRET: 0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@shop.test
      ADMIN_PASSWORD: integration-admin-password
      SHOP_CONTACT_EMAIL: orders@shop.test
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Preflight
        run: pnpm run preflight

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm -C apps/web exec prisma generate

      - name: Deploy migrations to blank database
        run: pnpm -C apps/web exec prisma migrate deploy

      - name: PostgreSQL integration tests
        run: pnpm -C apps/web test:integration

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_DB: shop_test
          POSTGRES_USER: shop_test
          POSTGRES_PASSWORD: shop_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop_test -d shop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      DATABASE_URL: postgresql://shop_test:shop_test_password@127.0.0.1:5432/shop_test?schema=public
      AUTH_SECRET: 0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@shop.test
      ADMIN_PASSWORD: browser-test-admin-password
      SHOP_CONTACT_EMAIL: orders@shop.test
      NEXTAUTH_URL: http://127.0.0.1:3001
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Preflight
        run: pnpm run preflight

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Prisma generate
        run: pnpm -C apps/web exec prisma generate

      - name: Deploy migrations to blank database
        run: pnpm -C apps/web exec prisma migrate deploy

      - name: Build application
        run: pnpm -C apps/web build

      - name: Prepare standalone browser runtime
        shell: bash
        run: |
          set -euo pipefail
          server_dir="apps/web/.next/standalone/apps/web"
          test -f "$server_dir/server.js"
          mkdir -p "$server_dir/.next"
          cp -a apps/web/.next/static "$server_dir/.next/static"
          if [ -d apps/web/public ]; then
            cp -a apps/web/public "$server_dir/public"
          fi

      - name: Browser end-to-end tests
        run: pnpm -C apps/web test:e2e
