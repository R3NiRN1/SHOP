name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-placeholder-not-for-prod
      NEXTAUTH_SECRET: ci-placeholder-not-for-prod
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostics
        shell: pwsh
        run: |
          Get-ChildItem
          if (-not (Test-Path pnpm-lock.yaml)) { throw "pnpm-lock.yaml missing" }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Preflight
        run: pnpm run preflight

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Doctor
        run: pnpm run doctor

      - name: Prisma client smoke check
        working-directory: apps/web
        run: node -e "require('@prisma/client'); console.log('prisma client ok')"

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
